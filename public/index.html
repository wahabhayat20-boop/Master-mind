<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASTER MIND MD - Pairing Panel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 {
            color: #58a6ff;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            color: #8b949e;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #30363d;
            border-radius: 6px;
            background-color: #0d1117;
            color: #fff;
            font-size: 16px;
            margin-bottom: 15px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #58a6ff;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background-color: #2ea043;
        }
        .code-display {
            margin-top: 20px;
            padding: 15px;
            background-color: #0d1117;
            border: 1px dashed #58a6ff;
            border-radius: 6px;
            font-size: 20px;
            font-weight: bold;
            color: #3fb950;
            letter-spacing: 2px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>MASTER MIND MD</h1>
        <p>Enter your WhatsApp Number with Country Code</p>
        <input type="text" id="phoneNumber" placeholder="e.g. 923001234567">
        <button onclick="getPairingCode()">Get Pairing Code</button>
        <div id="pairingCode" class="code-display"></div>
    </div>

    <script>
        async function getPairingCode() {
            const phone = document.getElementById('phoneNumber').value.trim();
            const codeBox = document.getElementById('pairingCode');

            if (!phone) {
                alert('Please enter a valid phone number!');
                return;
            }

            codeBox.style.display = 'block';
            codeBox.innerText = 'Generating code...';

            try {
                const response = await fetch(`/pair?number=${phone}`);
                const data = await response.json();

                if (data.code) {
                    codeBox.innerText = data.code;
                } else {
                    codeBox.innerText = 'Error getting code!';
                }
            } catch (err) {
                codeBox.innerText = 'Failed to connect to server!';
            }
        }
    </script>
</body>
</html>
